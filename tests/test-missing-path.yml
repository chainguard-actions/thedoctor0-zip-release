name: Test missing path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure path does not exist
        run: rm -rf zt-does-not-exist zt-missing.zip
      - id: action
        uses: .
        continue-on-error: true
        with:
          filename: zt-missing.zip
          path: zt-does-not-exist
          exclusions: nothing-here
      - name: Assert action failed and no archive created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent path"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/zt-missing.zip" ]; then
            echo "FAIL: archive should not exist"
            exit 1
          fi
          echo "PASS"
